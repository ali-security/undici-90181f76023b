name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@40c09b7dc99638e5ddb0bfd91c1673effc064d8a # v4.8.1

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          # Using `latest` as `lts` could point to previous major version.
          # Different versions of Node.js can cause different linting results
          # (e.g. dependening on process.getBuiltinModule())
          node-version: 'latest'

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

  test:
    name: Test with Node.js ${{ matrix.node-version }} on ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      max-parallel: 0
      matrix:
        node-version: ['20', '22', '24', '25']
        runs-on: ['ubuntu-latest', 'windows-latest', 'macos-latest']
        exclude:
          - node-version: '20'
            runs-on: windows-latest
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Setup Node.js@${{ matrix.node-version }}
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Print version information
        run: |
          echo OS: $(node -p "os.version()")
          echo Node.js: $(node --version)
          echo "Node.js built-in dependencies: $(node -p "'\r\n' + (Object.entries(process.versions).map(([k, v], i, arr) => (i !== arr.length - 1 ? '├──' : '└──') + k + '@' + v)).join('\r\n')")"
          echo npm: $(npm --version)
          echo git: $(git --version)

      - name: Install dependencies
        run: npm install

      - name: Configure hosts file for WPT (Windows)
        if: runner.os == 'Windows'
        run: |
          cd ${{ github.workspace }}\test\web-platform-tests\wpt
          python wpt make-hosts-file | Out-File $env:SystemRoot\System32\drivers\etc\hosts -Encoding ascii -Append
        shell: powershell

      - name: Configure hosts file for WPT (Unix)
        if: runner.os != 'Windows'
        run: |
          cd ${{ github.workspace }}/test/web-platform-tests/wpt
          python3 wpt make-hosts-file | sudo tee -a /etc/hosts

      - name: Generate PEM files
        run: npm run generate-pem
        id: generate-pem

      - name: Test unit
        run: npm run test:unit
        id: test-unit
        env:
          CI: true
          UNDICI_NO_WASM_SIMD: ''

      - name: Test node-test
        run: npm run test:node-test
        id: test-node-test
        env:
          CI: true
          UNDICI_NO_WASM_SIMD: ''

      - name: Test fetch
        run: npm run test:fetch
        id: test-fetch
        env:
          CI: true
          UNDICI_NO_WASM_SIMD: ''

      - name: Test node-fetch
        run: npm run test:node-fetch
        id: test-node-fetch
        env:
          CI: true
          UNDICI_NO_WASM_SIMD: ''

      - name: Test cache
        run: npm run test:cache
        id: test-cache
        env:
          CI: true
          UNDICI_NO_WASM_SIMD: ''

      - name: Test cache-interceptor  ${{ matrix.node-version != '20' && 'with' || 'without' }} sqlite
        run: npm run test:cache-interceptor
        id: test-cache-interceptor
        env:
          CI: true
          NODE_OPTIONS: ${{ matrix.node-version != '20' && '--experimental-sqlite' || '' }}
          UNDICI_NO_WASM_SIMD: ''

      - name: Test cache-tests
        run: npm run test:cache-tests
        id: test-cache-tests
        env:
          CI: true
          UNDICI_NO_WASM_SIMD: ''

      - name: Test cookies
        run: npm run test:cookies
        id: test-cookies
        env:
          CI: true
          UNDICI_NO_WASM_SIMD: ''

      - name: Test interceptors
        run: npm run test:interceptors
        id: test-interceptors
        env:
          CI: true
          UNDICI_NO_WASM_SIMD: ''

      - name: Test eventsource
        run: npm run test:eventsource
        id: test-eventsource
        env:
          CI: true
          UNDICI_NO_WASM_SIMD: ''

      - name: Test infra
        run: npm run test:infra
        id: test-infra
        env:
          CI: true
          UNDICI_NO_WASM_SIMD: ''

      - name: Test subresource-integrity
        run: npm run test:subresource-integrity
        id: test-subresource-integrity
        env:
          CI: true
          UNDICI_NO_WASM_SIMD: ''

      - name: Test websocket
        run: npm run test:websocket
        id: test-websocket
        env:
          CI: true
          UNDICI_NO_WASM_SIMD: ''

      - name: Test jest
        run: npm run test:jest
        id: test-jest
        env:
          CI: true
          UNDICI_NO_WASM_SIMD: ''

      # SEAL: test:wpt removed — external WPT conformance suite (git submodule); undici's wpt-runner only asserts per-file load status against expectation.json, and thousands of per-subtest "Failing" lines vary per OS/runner (HTTPS :8443, zstd, CORS), so it is environment-dependent conformance drift, not a test of undici's own code.

  test-with-no-wasm-simd:
    name: Test with Node.js ${{ matrix.node-version }} on ${{ matrix.runs-on }} with WASM SIMD disabled
    strategy:
      fail-fast: false
      max-parallel: 0
      matrix:
        node-version: ['24', '25']
        runs-on: ['ubuntu-latest']
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Setup Node.js@${{ matrix.node-version }}
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Print version information
        run: |
          echo OS: $(node -p "os.version()")
          echo Node.js: $(node --version)
          echo "Node.js built-in dependencies: $(node -p "'\r\n' + (Object.entries(process.versions).map(([k, v], i, arr) => (i !== arr.length - 1 ? '├──' : '└──') + k + '@' + v)).join('\r\n')")"
          echo npm: $(npm --version)
          echo git: $(git --version)

      - name: Install dependencies
        run: npm install

      - name: Configure hosts file for WPT (Windows)
        if: runner.os == 'Windows'
        run: |
          cd ${{ github.workspace }}\test\web-platform-tests\wpt
          python wpt make-hosts-file | Out-File $env:SystemRoot\System32\drivers\etc\hosts -Encoding ascii -Append
        shell: powershell

      - name: Configure hosts file for WPT (Unix)
        if: runner.os != 'Windows'
        run: |
          cd ${{ github.workspace }}/test/web-platform-tests/wpt
          python3 wpt make-hosts-file | sudo tee -a /etc/hosts

      - name: Generate PEM files
        run: npm run generate-pem
        id: generate-pem

      - name: Test unit
        run: npm run test:unit
        id: test-unit
        env:
          CI: true
          UNDICI_NO_WASM_SIMD: '1'

      - name: Test node-test
        run: npm run test:node-test
        id: test-node-test
        env:
          CI: true
          UNDICI_NO_WASM_SIMD: '1'

      - name: Test fetch
        run: npm run test:fetch
        id: test-fetch
        env:
          CI: true
          UNDICI_NO_WASM_SIMD: '1'

      - name: Test node-fetch
        run: npm run test:node-fetch
        id: test-node-fetch
        env:
          CI: true
          UNDICI_NO_WASM_SIMD: '1'

      - name: Test cache
        run: npm run test:cache
        id: test-cache
        env:
          CI: true
          UNDICI_NO_WASM_SIMD: '1'

      - name: Test cache-interceptor  ${{ matrix.node-version != '20' && 'with' || 'without' }} sqlite
        run: npm run test:cache-interceptor
        id: test-cache-interceptor
        env:
          CI: true
          NODE_OPTIONS: ${{ matrix.node-version != '20' && '--experimental-sqlite' || '' }}
          UNDICI_NO_WASM_SIMD: '1'

      - name: Test cache-tests
        run: npm run test:cache-tests
        id: test-cache-tests
        env:
          CI: true
          UNDICI_NO_WASM_SIMD: '1'

      - name: Test cookies
        run: npm run test:cookies
        id: test-cookies
        env:
          CI: true
          UNDICI_NO_WASM_SIMD: '1'

      - name: Test interceptors
        run: npm run test:interceptors
        id: test-interceptors
        env:
          CI: true
          UNDICI_NO_WASM_SIMD: '1'

      - name: Test eventsource
        run: npm run test:eventsource
        id: test-eventsource
        env:
          CI: true
          UNDICI_NO_WASM_SIMD: '1'

      - name: Test infra
        run: npm run test:infra
        id: test-infra
        env:
          CI: true
          UNDICI_NO_WASM_SIMD: '1'

      - name: Test subresource-integrity
        run: npm run test:subresource-integrity
        id: test-subresource-integrity
        env:
          CI: true
          UNDICI_NO_WASM_SIMD: '1'

      - name: Test websocket
        run: npm run test:websocket
        id: test-websocket
        env:
          CI: true
          UNDICI_NO_WASM_SIMD: '1'

      - name: Test jest
        run: npm run test:jest
        id: test-jest
        env:
          CI: true
          UNDICI_NO_WASM_SIMD: '1'

      # SEAL: test:wpt removed — external WPT conformance suite (git submodule); undici's wpt-runner only asserts per-file load status against expectation.json, and thousands of per-subtest "Failing" lines vary per OS/runner (HTTPS :8443, zstd, CORS), so it is environment-dependent conformance drift, not a test of undici's own code.

  test-without-intl:
    if: false
    name: Test with Node.js ${{ matrix.node-version }} compiled --without-intl
    strategy:
      fail-fast: false
      max-parallel: 0
      matrix:
        node-version: ['20', '22', '24', '25']
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout Repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
          submodules: recursive

      # Setup node, install deps, and build undici prior to building icu-less node and testing
      - name: Setup Node.js@${{ matrix.node-version }}
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Build undici
        run: npm run build:node

      - name: Determine latest release
        id: release
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          result-encoding: string
          script: |
            const req = await fetch('https://nodejs.org/download/release/index.json')
            const releases = await req.json()

            const latest = releases.find((r) => r.version.startsWith('v${{ matrix.node-version }}'))
            return latest.version

      - name: Download and extract source
        run: curl https://nodejs.org/download/release/${{ steps.release.outputs.result }}/node-${{ steps.release.outputs.result }}.tar.xz | tar xfJ -

      - name: Install ninja
        run: sudo apt-get install ninja-build

      - name: ccache
        uses: hendrikmuhs/ccache-action@bfa03e1de4d7f7c3e80ad9109feedd05c4f5a716 #v1.2.19
        with:
          key: node${{ matrix.node-version }}

      - name: Build node
        working-directory: ./node-${{ steps.release.outputs.result }}
        run: |
          export CC="ccache gcc"
          export CXX="ccache g++"
          ./configure --without-intl --ninja --prefix=./final
          make
          make install
          echo "$(pwd)/final/bin" >> $GITHUB_PATH

      - name: Print version information
        run: |
          echo OS: $(node -p "os.version()")
          echo Node.js: $(node --version)
          echo "Node.js built-in dependencies: $(node -p "'\r\n' + (Object.entries(process.versions).map(([k, v], i, arr) => (i !== arr.length - 1 ? '├──' : '└──') + k + '@' + v)).join('\r\n')")"
          echo npm: $(npm --version)
          echo git: $(git --version)
          echo icu config: $(node -e "console.log(process.config)" | grep icu)

      - name: Configure hosts file for WPT (Windows)
        if: runner.os == 'Windows'
        run: |
          cd ${{ github.workspace }}\test\web-platform-tests\wpt
          python wpt make-hosts-file | Out-File $env:SystemRoot\System32\drivers\etc\hosts -Encoding ascii -Append
        shell: powershell

      - name: Configure hosts file for WPT (Unix)
        if: runner.os != 'Windows'
        run: |
          cd ${{ github.workspace }}/test/web-platform-tests/wpt
          python3 wpt make-hosts-file | sudo tee -a /etc/hosts

      - name: Run tests
        run: npm run test:javascript:without-intl

  test-without-ssl:
    if: false
    name: Test with Node.js ${{ matrix.node-version }} compiled --without-ssl
    strategy:
      fail-fast: false
      max-parallel: 0
      matrix:
        node-version: ['20', '22', '24', '25']
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout Repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
          submodules: recursive

      # Setup node, install deps, and build undici prior to building icu-less node and testing
      - name: Setup Node.js@${{ matrix.node-version }}
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Build undici
        run: npm run build:node

      - name: Determine latest release
        id: release
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          result-encoding: string
          script: |
            const req = await fetch('https://nodejs.org/download/release/index.json')
            const releases = await req.json()

            const latest = releases.find((r) => r.version.startsWith('v${{ matrix.node-version }}'))
            return latest.version

      - name: Download and extract source
        run: curl https://nodejs.org/download/release/${{ steps.release.outputs.result }}/node-${{ steps.release.outputs.result }}.tar.xz | tar xfJ -

      - name: Install ninja
        run: sudo apt-get install ninja-build

      - name: ccache
        uses: hendrikmuhs/ccache-action@bfa03e1de4d7f7c3e80ad9109feedd05c4f5a716 #v1.2.19
        with:
          key: node${{ matrix.node-version }}

      - name: Build node
        working-directory: ./node-${{ steps.release.outputs.result }}
        run: |
          export CC="ccache gcc"
          export CXX="ccache g++"
          ./configure --without-ssl --ninja --prefix=./final
          make
          make install
          echo "$(pwd)/final/bin" >> $GITHUB_PATH

      - name: Print version information
        run: |
          echo OS: $(node -p "os.version()")
          echo Node.js: $(node --version)
          echo "Node.js built-in dependencies: $(node -p "'\r\n' + (Object.entries(process.versions).map(([k, v], i, arr) => (i !== arr.length - 1 ? '├──' : '└──') + k + '@' + v)).join('\r\n')")"
          echo npm: $(npm --version)
          echo git: $(git --version)
          echo icu config: $(node -e "console.log(process.config)" | grep icu)

      - name: Try loading Node.js without Crypto
        run: node index.js

  test-fuzzing:
    name: Fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm install

      - name: Run fuzzing tests
        run: npm run test:fuzzing

  test-shared-builtin:
    if: false
    name: Test with Node.js ${{ matrix.node-version }} compiled --shared-builtin-undici/undici-path
    uses: ./.github/workflows/nodejs-shared.yml
    strategy:
      fail-fast: false
      max-parallel: 0
      matrix:
        node-version: ['24', '25']
        runs-on: ['ubuntu-latest']
    with:
      node-version: ${{ matrix.node-version }}

  test-types:
    name: Test TypeScript types
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm install

      - name: Run typings tests
        run: npm run test:typescript

  pack:
    name: Pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '24.13.0'
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Pack
        run: npm pack --ignore-scripts
      - name: Upload tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: undici-tgz
          path: undici-7.19.2.tgz
          if-no-files-found: error

  automerge:
    if: false
    timeout-minutes: 5
    needs:
      - dependency-review
      - test
      - test-types
      - test-with-no-wasm-simd
      - test-without-intl
      - test-fuzzing
      - lint
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge Dependabot PR
        uses: fastify/github-action-merge-dependabot@1b2ed42db8f9d81a46bac83adedfc03eb5149dff # v3.11.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
